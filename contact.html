<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial, Helvetica, sans-serif;}
    html,body{height:100%;}
    body{background:#f4f6fa;display:flex;flex-direction:column;}

    /* NAVBAR */
    nav{
      background:#0b4aa6;
      padding:18px 30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      border-bottom:2px solid rgba(0,0,0,0.15);
    }
    .logo-box{
      width:60px;height:60px;
      background:#e9e9e9;
      border:2px solid #fff;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }
    .logo-box img{max-width:100%;max-height:100%;display:block;}
    .nav-links{list-style:none;display:flex;gap:24px;}
    .nav-links a{color:#fff;text-decoration:none;font-size:14px;}
    .nav-links a:hover{text-decoration:underline;}

    /* PAGE */
    main{
      width:min(1200px,95%);
      margin:0 auto;
      padding:30px 0 60px;
      flex:1;
    }

    .layout{
      display:flex;
      gap:40px;
      align-items:flex-start;
    }

    /* LEFT FORM BOX */
    .form-box{
      width:280px;
      background:#fff;
      border:2px solid #666;
      padding:16px 14px;
    }

    .form-title{
      text-align:center;
      font-size:14px;
      margin-bottom:12px;
      text-decoration:underline;
    }

    label{
      display:block;
      font-size:12px;
      margin:10px 0 4px;
      font-weight:bold;
      color:#111;
    }

    input[type="text"], input[type="email"]{
      width:60%;
      padding:5px 6px;
      border:1px solid #999;
      background:#eee;
      font-size:12px;
    }

    textarea{
      width:100%;
      height:110px;
      padding:8px;
      border:1px solid #999;
      background:#eee;
      resize:none;
      font-size:12px;
    }

    .file-box{
      width:100%;
      height:70px;
      border:1px solid #999;
      background:#eee;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      color:#666;
      margin-top:6px;
      position:relative;
      overflow:hidden;
    }

    .file-box input[type="file"]{
      position:absolute;
      inset:0;
      opacity:0;
      cursor:pointer;
    }

    .submit-btn{
      display:block;
      width:110px;
      margin:14px auto 0;
      padding:7px 0;
      background:#0b4aa6;
      color:#fff;
      border:none;
      cursor:pointer;
      font-size:13px;
      border-radius:2px;
    }

    /* RIGHT SIDE TEXT */
    .info{
      flex:1;
      text-align:center;
      padding-top:40px;
    }

    .info h1{
      font-size:30px;
      font-weight:normal;
      margin-bottom:12px;
      color:#111;
    }

    .info p{
      font-size:12px;
      color:#222;
      line-height:1.4;
    }

    /* FOOTER */
    footer{
      background:#0b4aa6;
      color:#fff;
      padding:12px 18px;
      margin-top:auto;
    }
    .footer-row{
      width:min(1200px,95%);
      margin:0 auto;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:12px;
      font-size:12px;
    }
    .social a{
      color:#fff;
      text-decoration:none;
      margin-right:8px;
      font-size:18px;
    }
    .social a:hover{color:#cfe6ff;}

    /* MOBILE */
    @media (max-width:900px){
      .layout{flex-direction:column;align-items:center;}
      .info{text-align:center;padding-top:20px;}
      .form-box{width:min(320px,90%);}
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <div class="logo-box">
      <img src="assets/kitlogo.png" alt="Logo">
    </div>

    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="product.html">Product</a></li>
      <li><a href="faqs.html">FAQs</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main>
    <div class="layout">

      <!-- LEFT: FORM -->
      <div class="form-box">
        <div class="form-title">Contact Form</div>

        <form>
          <label for="name">Name</label>
          <input id="name" type="text" placeholder="Name">

          <label for="email">Email</label>
          <input id="email" type="email" placeholder="Email">

          <label for="message">Message</label>
          <textarea id="message" placeholder="Message..."></textarea>

          <label for="file">Attachments</label>
          <div class="file-box">
            Choose file or drag here
            <input id="file" type="file">
          </div>

          <button class="submit-btn" type="submit">Submit</button>
        </form>
      </div>

      <!-- RIGHT: CONTACT INFO -->
      <div class="info">
        <h1>Contact Page</h1>
        <p>Contact us at: 07301026030</p>
        <p>30053531@live.nwrc.ac.uk</p>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-row">
      <span>Reach out to us on:</span>
      <div class="social">
        <a href="#" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
        <a href="#" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
        <a href="#" aria-label="Facebook"><i class="fab fa-facebook"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
