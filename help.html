<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
    html,body{height:100%}
    body{background:#f4f6fa;display:flex;flex-direction:column}

    /* NAVBAR */
    nav{
      background:#0b4aa6;
      padding:18px 30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }
    .logo-box{
      width:60px;height:60px;
      background:#e9e9e9;
      border:2px solid #fff;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .logo-box img{max-width:100%;max-height:100%}

    .nav-links{list-style:none;display:flex;gap:24px}
    .nav-links a{color:#fff;text-decoration:none;font-size:14px}
    .nav-links a:hover{text-decoration:underline}

    /* PAGE */
    main{
      flex:1;
      width:min(1000px,95%);
      margin:0 auto;
      padding:40px 0 60px;
      text-align:center;
    }

    h1{
      font-size:32px;
      font-weight:normal;
      margin-bottom:10px;
      color:#111;
    }

    .subtitle{
      font-size:16px;
      text-decoration:underline;
      margin-bottom:30px;
      color:#111;
    }

    /* SEARCH */
    .search-box{
      width:100%;
      max-width:600px;
      margin:0 auto 40px;
      position:relative;
    }

    .search-box input{
      width:100%;
      padding:10px 14px 10px 36px;
      border-radius:20px;
      border:1px solid #888;
      font-size:13px;
    }

    .search-box i{
      position:absolute;
      left:14px;
      top:50%;
      transform:translateY(-50%);
      color:#666;
      font-size:14px;
    }

    /* HELP GRID */
    .help-grid{
      display:grid;
      grid-template-columns:repeat(3, 1fr);
      gap:22px;
      justify-items:center;
    }

    .help-card{
      width:220px;
      padding:18px 10px;
      border:1px solid #777;
      background:#fff;
      font-size:13px;
      cursor:pointer;
    }

    .help-card:hover{
      background:#eef3ff;
    }

    /* FOOTER */
    footer{
      background:#0b4aa6;
      color:#fff;
      padding:12px 18px;
      margin-top:auto;
    }
    .footer-row{
      width:min(1000px,95%);
      margin:0 auto;
      display:flex;
      align-items:center;
      gap:12px;
      font-size:12px;
    }
    .social a{
      color:#fff;
      margin-right:8px;
      font-size:18px;
      text-decoration:none;
    }

    /* MOBILE */
    @media (max-width:800px){
      .help-grid{grid-template-columns:repeat(2,1fr)}
    }
    @media (max-width:500px){
      .help-grid{grid-template-columns:1fr}
      .help-card{width:90%}
    }
  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <div class="logo-box">
      <img src="assets/kitlogo.png" alt="Logo">
    </div>

    <ul class="nav-links">
      <li><a href="about.html">About</a></li>
      <li><a href="services.html">Services</a></li>
      <li><a href="team.html">Team</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="product.html">Product</a></li>
      <li><a href="help.html">Help</a></li>
    </ul>
  </nav>

  <!-- CONTENT -->
  <main>
    <h1>Help</h1>
    <div class="subtitle">How can we help?</div>

    <!-- Search -->
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" placeholder="Search">
    </div>

    <!-- Help Categories -->
    <div class="help-grid">
      <div class="help-card">Order Queries</div>
      <div class="help-card">Product and Stock</div>
      <div class="help-card">Delivery</div>
      <div class="help-card">Account and Profile</div>
      <div class="help-card">Returns and Refunds</div>
      <div class="help-card">Payment</div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer>
    <div class="footer-row">
      <span>Reach out to us on:</span>
      <div class="social">
        <a href="#"><i class="fab fa-instagram"></i></a>
        <a href="#"><i class="fab fa-tiktok"></i></a>
        <a href="#"><i class="fab fa-facebook"></i></a>
      </div>
    </div>
  </footer>

</body>
</html>
