<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homepage</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #f4f6fa;
      color: #333;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    nav {
      background-color: #0b1f3a;
      padding: 15px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .nav-left img {
      height: 50px;
      width: auto;
    }

    .search-bar {
      padding: 6px 12px;
      border-radius: 14px;
      border: none;
      outline: none;
      font-size: 14px;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 25px;
    }

    .nav-links a {
      text-decoration: none;
      color: #ffffff;
      font-size: 16px;
    }

    .nav-links a:hover {
      color: #4da3ff;
    }

    /* Hero */
    .hero {
      padding: 80px 40px;
      text-align: center;
      background: linear-gradient(135deg, #0b1f3a, #143a6f);
      color: white;
    }

    /* Sections */
    section {
      padding: 60px 40px;
      max-width: 1000px;
      margin: auto;
    }

    .section-image {
      width: 90%;
      max-width: 1000px;
      margin: 80px auto 0 auto;
      display: block;
      border-radius: 8px;
    }

    /* Footer */
    footer {
      background-color: #0b1f3a;
      color: white;
      text-align: center;
      padding: 25px 10px;
      margin-top: auto;
    }

    .social-icons a {
      color: white;
      font-size: 22px;
      margin: 0 12px;
      text-decoration: none;
    }

    .social-icons a:hover {
      color: #4da3ff;
    }
  </style>
</head>

<body>

  <!-- Navbar -->
  <nav>
    <div class="nav-left">
      <img src="assets/kitlogo.png" alt="Logo">
      <input class="search-bar" type="text" placeholder="Search">
    </div>

    <ul class="nav-links">
      <li><a href="#about">About</a></li>
      <li><a href="#team">Team</a></li>
      <li><a href="#services">Services</a></li>
      <li><a href="#faqs">FAQs</a></li>
      <li><a href="#product">Product</a></li>
    </ul>
  </nav>

  <!-- Hero -->
  <div class="hero">
    <h1>Welcome to Cillian's Kits</h1>
    <p>We design, produce and bring your vision to life through our kits.</p>
  </div>

  <!-- About -->
  <section id="about">
    <h2>About</h2>
    <p>
      We design, produce, and deliver high-quality custom sports kits built for performance and style.
    </p>
    <img src="assets/footballteam.png" alt="About our kits" class="section-image">
  </section>

  <!-- Footer -->
  <footer>
    <div class="social-icons">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-tiktok"></i></a>
      <a href="#"><i class="fab fa-facebook"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
    </div>
    <p>© 2026 Cillian's Kits. All rights reserved.</p>
  </footer>

</body>
</html>
